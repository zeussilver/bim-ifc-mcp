[project]
name = "bim-ifc-mcp"
version = "0.1.0"
description = "MCP server exposing deterministic IFC (BIM) queries and rule checks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell>=0.9.0",
    "mcp[cli]>=2.3.0",
    "numpy>=2",
    "shapely>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bim-ifc-mcp = "bim_ifc_mcp.server:main"
